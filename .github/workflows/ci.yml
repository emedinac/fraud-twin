name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "contracts/**"
      - "tests/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/ci.yml"
      - "docker-compose.yml"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fraudtwin
          POSTGRES_PASSWORD: fraudtwin
          POSTGRES_DB: fraudtwin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fraudtwin -d fraudtwin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FRAUDTWIN_POSTGRES_DSN: postgresql://fraudtwin:fraudtwin@localhost:5432/fraudtwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install -E postgres -E kafka
      - name: Ruff lint
        run: poetry run ruff check .
      - name: Avro contract registry
        run: poetry run fraudtwin schema validate
      - name: Poetry validation
        run: poetry check --strict
      - name: Ruff format
        run: poetry run ruff format --check .
      - name: Mypy
        run: poetry run mypy src
      - name: Tests
        run: poetry run pytest
      - name: Build
        run: poetry build
      - name: Installed-wheel contract registry
        run: |
          python -m venv /tmp/fraudtwin-wheel
          /tmp/fraudtwin-wheel/bin/pip install dist/*.whl
          /tmp/fraudtwin-wheel/bin/fraudtwin schema validate
      - name: Diff check
        run: git diff --check
