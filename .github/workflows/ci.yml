name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "contracts/**"
      - "tests/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/ci.yml"
      - "docker-compose.yml"
      - "observability/**"
      - "docs/workflows.md"
      - "docs/development.md"
      - "README.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fraudtwin
          POSTGRES_PASSWORD: fraudtwin
          POSTGRES_DB: fraudtwin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fraudtwin -d fraudtwin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FRAUDTWIN_POSTGRES_DSN: postgresql://fraudtwin:fraudtwin@localhost:5432/fraudtwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install -E postgres -E kafka -E observability
      - name: Ruff lint
        run: poetry run ruff check .
      - name: Avro contract registry
        run: poetry run fraudtwin schema validate
      - name: Poetry validation
        run: poetry check --strict
      - name: Observability Compose configuration
        run: |
          GRAFANA_ADMIN_PASSWORD=ci-only-password docker compose --profile observability config --quiet
      - name: Ruff format
        run: poetry run ruff format --check .
      - name: Mypy
        run: poetry run mypy src
      - name: Tests
        run: poetry run pytest
      - name: Prometheus/Grafana integration
        env:
          GRAFANA_ADMIN_PASSWORD: ci-only-password
        run: |
          set -euo pipefail
          run_dir="$(mktemp -d)"
          trap 'docker compose --profile observability down >/dev/null 2>&1 || true; rm -rf "$run_dir"' EXIT
          docker compose --profile observability up -d prometheus grafana
          poetry run fraudtwin generate configs/minimal.yaml \
            --output-dir "$run_dir" \
            --metrics-host 0.0.0.0 --metrics-port 9464 --metrics-hold-seconds 12 \
            >"$run_dir/generate.log" &
          generator_pid=$!
          target_up=""
          query_result=""
          for _ in $(seq 1 60); do
            target_up="$(curl -fsS http://127.0.0.1:9090/api/v1/targets 2>/dev/null || true)"
            query_result="$(curl -fsS --get --data-urlencode 'query=events_generated_total' \
              http://127.0.0.1:9090/api/v1/query 2>/dev/null || true)"
            if grep -q '"health":"up"' <<<"$target_up" && \
               grep -q '"status":"success"' <<<"$query_result"; then
              break
            fi
            sleep 0.25
          done
          grep -q '"health":"up"' <<<"$target_up"
          grep -q '"status":"success"' <<<"$query_result"
          wait "$generator_pid"
          curl -fsS -u "admin:${GRAFANA_ADMIN_PASSWORD}" \
            http://127.0.0.1:3000/api/dashboards/uid/fraudtwin-m27 | \
            grep -q 'FraudTwin run observability'
      - name: Build
        run: poetry build
      - name: Installed-wheel contract registry
        run: |
          python -m venv /tmp/fraudtwin-wheel
          /tmp/fraudtwin-wheel/bin/pip install dist/*.whl
          /tmp/fraudtwin-wheel/bin/fraudtwin schema validate
      - name: Diff check
        run: git diff --check

  integration-smoke:
    # External services are intentionally exercised only for pull requests;
    # normal local/CI unit runs keep the optional stack out of the fast path.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: fraudtwin
      POSTGRES_PASSWORD: fraudtwin
      POSTGRES_DB: fraudtwin
      FRAUDTWIN_POSTGRES_DSN: postgresql://fraudtwin:fraudtwin@localhost:5432/fraudtwin
      FRAUDTWIN_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      FRAUDTWIN_SCHEMA_REGISTRY_URL: http://localhost:8081
      FRAUDTWIN_ICEBERG_CATALOG_URI: http://localhost:8181
      FRAUDTWIN_ICEBERG_WAREHOUSE: s3://warehouse/
      FRAUDTWIN_ICEBERG_S3_ENDPOINT: http://localhost:9000
      FRAUDTWIN_ICEBERG_S3_ACCESS_KEY: minioadmin
      FRAUDTWIN_ICEBERG_S3_SECRET_KEY: minioadmin
      GRAFANA_ADMIN_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install integration dependencies
        run: poetry install -E postgres -E kafka -E lakehouse
      - name: Run PostgreSQL, Kafka, and Iceberg smoke tests
        run: |
          set -euo pipefail
          cleanup() {
            docker compose --profile integration --profile streaming --profile lakehouse down -v >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker compose --profile integration --profile streaming --profile lakehouse up -d \
            postgres kafka schema-registry streaming-topics minio minio-init iceberg-rest

          for _ in $(seq 1 60); do
            if docker compose exec -T postgres pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker compose exec -T postgres pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"

          for _ in $(seq 1 60); do
            topics="$(docker compose exec -T kafka kafka-topics --bootstrap-server kafka:29092 --list 2>/dev/null || true)"
            if curl -fsS http://localhost:8081/subjects >/dev/null 2>&1 && \
               grep -q '^fraudsim\.payment\.events\.v1$' <<<"$topics"; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8081/subjects >/dev/null
          docker compose exec -T kafka kafka-topics --bootstrap-server kafka:29092 --list | \
            grep -q '^fraudsim\.payment\.events\.v1$'

          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1 && \
               curl -fsS http://localhost:8181/v1/config >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:9000/minio/health/live >/dev/null
          curl -fsS http://localhost:8181/v1/config >/dev/null

          FRAUDTWIN_INTEGRATION_SMOKE=1 poetry run pytest tests/test_integration_smoke.py --no-cov -q
