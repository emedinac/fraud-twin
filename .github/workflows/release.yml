name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  actions: write
  contents: write
  id-token: write
  attestations: write

jobs:
  detect-release:
    name: Detect release marker
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      release: ${{ steps.detect.outputs.release }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - name: Inspect ref and commit message
        id: detect
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then
            printf 'release=true\ntag=%s\n' "$REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t release_tags < <(
            printf '%s\n' "$COMMIT_MESSAGE" |
              grep -oE 'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)' |
              sort -u || true
          )
          if [[ "${#release_tags[@]}" -eq 1 ]]; then
            printf 'release=true\ntag=%s\n' "${release_tags[0]}" >> "$GITHUB_OUTPUT"
          else
            # A normal main push, or an ambiguous marker, is a successful
            # no-op. Do not fail the workflow or start the package job.
            printf 'release=false\n' >> "$GITHUB_OUTPUT"
          fi

  package:
    needs: detect-release
    if: needs.detect-release.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-poetry
        with:
          python-version: "3.12"
      - name: Validate release identity
        run: >-
          python .github/scripts/release_policy.py check
          --tag "${{ needs.detect-release.outputs.tag }}"
      - name: Install project
        run: poetry install --only main,docs
      - name: Verify release metadata
        run: |
          poetry check --strict
          poetry run fraudtwin schema validate
      - name: Build strict documentation
        run: poetry run sphinx-build -E -W -b html docs /tmp/fraudtwin-release-docs
      - name: Build distributions
        run: poetry build
      - name: Validate distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
          python -m venv /tmp/fraudtwin-release
          /tmp/fraudtwin-release/bin/pip install dist/*.whl
          /tmp/fraudtwin-release/bin/fraudtwin schema validate
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Create release tag for a marked main commit
        if: github.ref_type != 'tag'
        env:
          RELEASE_TAG: ${{ needs.detect-release.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null; then
            existing_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            if [[ "$existing_commit" != "$GITHUB_SHA" ]]; then
              echo "${RELEASE_TAG} already points to ${existing_commit}, not ${GITHUB_SHA}." >&2
              exit 1
            fi
          else
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Release ${RELEASE_TAG}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.detect-release.outputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/* --generate-notes
      - name: Deploy documentation for a marked main commit
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
