name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-poetry
        with:
          python-version: "3.12"
      - name: Validate release identity
        run: python .github/scripts/release_policy.py check --tag "$GITHUB_REF_NAME"
      - name: Install project
        run: poetry install --only main,docs
      - name: Verify release metadata
        run: |
          poetry check --strict
          poetry run fraudtwin schema validate
      - name: Build strict documentation
        run: poetry run sphinx-build -E -W -b html docs /tmp/fraudtwin-release-docs
      - name: Build distributions
        run: poetry build
      - name: Validate distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
          python -m venv /tmp/fraudtwin-release
          /tmp/fraudtwin-release/bin/pip install dist/*.whl
          /tmp/fraudtwin-release/bin/fraudtwin schema validate
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
