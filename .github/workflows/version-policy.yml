# Names this automation so it is identifiable in the project UI.
name: Version and commit policy

# Selects the events that trigger this automation.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# Limits the repository permissions granted to this workflow.
permissions:
  contents: read
  pull-requests: read

# Prevents conflicting runs from competing for the same resource.
concurrency:
  group: version-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Defines the checks and deployment steps run by this workflow.
jobs:
  validate:
    name: Validate version, changelog, and commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted policy scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: policy
          fetch-depth: 1

      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: work
          fetch-depth: 1

      - name: Collect pull request commit subjects
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
            --jq '.[].commit.message | split("\n")[0]' \
            > /tmp/fraudtwin-commit-subjects.txt

      - name: Validate version, release identity, and commit subjects
        run: |
          python policy/.github/scripts/release_policy.py check \
            --root work \
            --base-root policy \
            --commit-subjects /tmp/fraudtwin-commit-subjects.txt
