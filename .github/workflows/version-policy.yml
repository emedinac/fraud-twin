name: Version and commit policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: version-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate version, changelog, and commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted policy scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: policy
          fetch-depth: 1

      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: work
          fetch-depth: 1

      - name: Bump same-repository pull request version
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python policy/.github/scripts/release_policy.py bump \
            --root work \
            --base-root policy
          if [[ -n "$(git -C work status --short)" ]]; then
            version="$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("work/pyproject.toml").read_text())["project"]["version"])')"
            git -C work config user.name "github-actions[bot]"
            git -C work config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C work add pyproject.toml src/fraudtwin/__init__.py
            git -C work commit -m "chore: bump version to ${version}"
            git -C work push origin "HEAD:${HEAD_REF}"
          fi

      - name: Collect pull request commit subjects
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
            --jq '.[].commit.message | split("\n")[0]' \
            > /tmp/fraudtwin-commit-subjects.txt

      - name: Validate release identity and commit subjects
        run: |
          python policy/.github/scripts/release_policy.py check \
            --root work \
            --commit-subjects /tmp/fraudtwin-commit-subjects.txt
