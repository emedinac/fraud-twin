# Names this automation so it is identifiable in the project UI.
name: Setup Python and Poetry
# Explains the purpose of this reusable action.
description: Install Poetry and configure Python with dependency caching
# Declares the values callers can pass into this action.
inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.12"
  cache-dependency-path:
    description: File used to invalidate the Poetry dependency cache
    required: false
    default: poetry.lock
# Defines the steps and runtime used by this action.
runs:
  using: composite
  steps:
    - name: Install Poetry
      shell: bash
      run: pipx install poetry
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: poetry
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
