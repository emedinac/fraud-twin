# Fixes the seed and time window used by this generated run.
simulation:
  seed: 42
  start: 2026-01-01T00:00:00Z
  duration_days: 365
  speed: batch

# Sets the sizes of the generated customer, account, and service pools.
population:
  customers: 10000000
  institutions: 100
  accounts: 15000000
  cards: 12000000
  merchants: 100000
  devices: 12000000
  pix_keys: 8000000

# Controls daily payment volume and the share assigned to each rail.
payments:
  daily_target: 2740000
  rails:
    CARD: 0.55
    PIX: 0.30
    ACCOUNT_TRANSFER: 0.15

# Selects fraud scenarios and controls their prevalence and campaign sizes.
fraud:
  enabled: true
  target_rate: 0.002
  scenario_count: 5
  hard_negative_rate: 1.0

# Controls how fraud events become alerts, cases, disputes, and labels.
fraud_workflow:
  enabled: true

# Controls the data-quality profile and any injected faults or outages.
quality:
  profile: clean

# Chooses which generated artifacts and external sinks are written.
outputs:
  parquet: true
  postgres: false
  kafka: false

# Sets payment targets, partitioning, workers, and checkpoint behavior.
scale:
  profile: billion
  shard_count: 256
  chunk_size: 10000
  worker_count: 16
  output_batch_size: 10000
  checkpoint_frequency_chunks: 10
  partition_mapping: stable_hash_v1
