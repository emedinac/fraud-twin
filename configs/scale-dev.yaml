# Fixes the seed and time window used by this generated run.
simulation:
  seed: 42
  start: 2026-01-01T00:00:00Z
  duration_days: 1
  speed: batch

# Sets the sizes of the generated customer, account, and service pools.
population:
  customers: 10
  institutions: 3
  accounts: 15
  cards: 12
  merchants: 3
  devices: 12
  pix_keys: 8

# Controls daily payment volume and the share assigned to each rail.
payments:
  daily_target: 1000
  rails: {CARD: 0.55, PIX: 0.30, ACCOUNT_TRANSFER: 0.15}

# Selects fraud scenarios and controls their prevalence and campaign sizes.
fraud:
  enabled: false
  target_rate: 0.002
  scenario_count: 5
  hard_negative_rate: 1.0

# Controls the data-quality profile and any injected faults or outages.
quality:
  profile: clean

# Chooses which generated artifacts and external sinks are written.
outputs:
  parquet: true

# Sets payment targets, partitioning, workers, and checkpoint behavior.
scale:
  profile: dev
  target_payments: 1000
  shard_count: 2
  chunk_size: 100
  worker_count: 2
  output_batch_size: 100
