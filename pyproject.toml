[project]
name = "fraudtwin"
version = "0.29.0"
description = "Fraud emulator for real-world ML and data pipelines"
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["fraud", "synthetic-data", "payments", "machine-learning", "graph-ml"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "polars>=1.0,<2.0",
    "pydantic>=2.7,<3.0",
    "PyYAML>=6.0,<7.0",
    "typer>=0.27,<0.28",
    "pandera[polars] (>=0.26,<1.0)",
    "avro (>=1.12,<2.0)",
]

[project.urls]
Homepage = "https://github.com/emedinac/fraud-twin"
Repository = "https://github.com/emedinac/fraud-twin"
Documentation = "https://emedinac.github.io/fraud-twin/"
Issues = "https://github.com/emedinac/fraud-twin/issues"

[project.scripts]
fraudtwin = "fraudtwin.cli:main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4.0"]
graph = ["torch>=2.2,<3.0", "torch-geometric>=2.5,<3.0"]
ml = [
    "scikit-learn>=1.5,<2.0",
    "lightgbm>=4.0,<5.0",
    "xgboost>=2.0,<4.0",
    "catboost>=1.2,<2.0",
]
mlflow = ["mlflow>=2.14,<4.0"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "fraudtwin", from = "src" }]
include = [
    "src/fraudtwin/public_packs/*.yaml",
    "src/fraudtwin/quality_profiles/*.yaml",
    "src/fraudtwin/migrations/*.sql",
    { path = "contracts/avro/**/*.avsc", format = ["sdist", "wheel"] },
    { path = "contracts/avro/registry.yaml", format = ["sdist", "wheel"] },
]

[tool.poetry.group.dev.dependencies]
    hypothesis = "^6.100"
    mypy = "^1.11"
pytest = "^8.0"
pytest-cov = "^5.0"
ruff = "^0.6"
types-PyYAML = "^6.0"
sdmetrics = {version = ">=0.30,<0.32", python = ">=3.12,<3.15"}
ipykernel = "^7.3.0"

[tool.poetry.group.docs.dependencies]
sphinx = ">=7.0,<9.0"
furo = ">=2024.1,<2027.0"
myst-parser = ">=3.0,<5.0"

[tool.pytest.ini_options]
addopts = "--cov=fraudtwin --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 50

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
