services:
  postgres:
    image: postgres:16
    profiles: [integration]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraudtwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraudtwin}
      POSTGRES_DB: ${POSTGRES_DB:-fraudtwin}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fraudtwin} -d $${POSTGRES_DB:-fraudtwin}"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    profiles: [streaming, lakehouse]
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    profiles: [streaming, lakehouse]
    depends_on: [kafka]
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
  streaming-topics:
    image: confluentinc/cp-kafka:7.7.1
    profiles: [streaming, lakehouse]
    depends_on: [kafka]
    entrypoint: ["/bin/bash", "-c"]
    command: >-
      "until kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do sleep 2; done;
      for topic in fraudsim.payment.events.v1 fraudsim.customer.disputes.v1
      fraudsim.fraud.alerts.v1 fraudsim.fraud.cases.v1 fraudsim.fraud.case-confirmations.v1
      fraudsim.fraud.labels.v1; do kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic $$topic --partitions 3 --replication-factor 1 --config cleanup.policy=delete; done"

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: [lakehouse]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: [lakehouse]
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done;
      mc mb --ignore-existing local/warehouse"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    profiles: [lakehouse]
    depends_on: [minio-init]
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: us-east-1
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_PATH_STYLE_ACCESS: "true"

  spark:
    image: tabulario/spark-iceberg:3.5.3_1.6.1
    profiles: [lakehouse]
    depends_on: [iceberg-rest]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: us-east-1
      SPARK_SQL_CATALOG_FRAUDTWIN: org.apache.iceberg.spark.SparkCatalog
      SPARK_SQL_CATALOG_FRAUDTWIN_CATALOG_IMPL: org.apache.iceberg.rest.RESTCatalog
      SPARK_SQL_CATALOG_FRAUDTWIN_URI: http://iceberg-rest:8181
      SPARK_SQL_CATALOG_FRAUDTWIN_WAREHOUSE: s3://warehouse/
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_PATH_STYLE_ACCESS: "true"
    volumes:
      - ./:/opt/fraudtwin:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    profiles: [observability]
    depends_on: [prometheus]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD before starting observability}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  prometheus-data:
  grafana-data:
