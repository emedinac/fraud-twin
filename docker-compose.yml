services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    profiles: [streaming]
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    profiles: [streaming]
    depends_on: [kafka]
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
  streaming-topics:
    image: confluentinc/cp-kafka:7.7.1
    profiles: [streaming]
    depends_on: [kafka]
    entrypoint: ["/bin/bash", "-c"]
    command: >-
      "until kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do sleep 2; done;
      for topic in fraudsim.payment.events.v1 fraudsim.customer.disputes.v1
      fraudsim.fraud.alerts.v1 fraudsim.fraud.cases.v1 fraudsim.fraud.case-confirmations.v1
      fraudsim.fraud.labels.v1; do kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic $$topic --partitions 3 --replication-factor 1 --config cleanup.policy=delete; done"
