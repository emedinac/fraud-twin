<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Transaction Knowledge Graph Outlier</title>
  <desc id="desc">A knowledge graph of bank transaction nodes linked to a central hub, with one node flagged in red as a detected outlier signal.</desc>
  <defs>
    <radialGradient id="redWhite" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </radialGradient>
  </defs>

  <!-- detection pulse rings around the outlier -->
  <g fill="none" stroke="#F87171" stroke-opacity="0.55">
    <circle cx="82" cy="62" r="9"  stroke-width="1.2" stroke-dasharray="2 2"/>
    <circle cx="82" cy="62" r="13" stroke-width="1"   stroke-dasharray="2 3" stroke-opacity="0.3"/>
  </g>

  <!-- graph edges -->
  <g stroke="#93C5FD" stroke-width="1.6">
    <!-- spokes from hub -->
    <line x1="48" y1="50" x2="48" y2="20"/>
    <line x1="48" y1="50" x2="74" y2="34"/>
    <line x1="48" y1="50" x2="82" y2="62"/>
    <line x1="48" y1="50" x2="60" y2="84"/>
    <line x1="48" y1="50" x2="34" y2="84"/>
    <line x1="48" y1="50" x2="14" y2="62"/>
    <line x1="48" y1="50" x2="22" y2="34"/>
    <!-- outer connections -->
    <line x1="48" y1="20" x2="74" y2="34"/>
    <line x1="14" y1="62" x2="22" y2="34"/>
    <line x1="34" y1="84" x2="60" y2="84"/>
  </g>

  <!-- leaf nodes -->
  <g fill="#2563EB">
    <circle cx="48" cy="20" r="3.4"/>
    <circle cx="74" cy="34" r="3.4"/>
    <circle cx="60" cy="84" r="3.4"/>
    <circle cx="34" cy="84" r="3.4"/>
    <circle cx="14" cy="62" r="3.4"/>
    <circle cx="22" cy="34" r="3.4"/>
  </g>

  <!-- central hub node -->
  <circle cx="48" cy="50" r="5" fill="#1E3A8A"/>

  <!-- outlier node -->
  <circle cx="82" cy="62" r="6" fill="url(#redWhite)" stroke="#FEE2E2" stroke-width="0.8" stroke-opacity="0.6"/>

  <!-- signal trace, spikes at the outlier -->
  <polyline points="6,72 34,72 58,72 70,72 82,62 90,72"
            fill="none" stroke="#1D4ED8" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>
</svg>