# Fixes the seed and time window used by this generated run.
simulation:
  # Fixed seed makes this focused card run reproducible.
  seed: 4201
  start: 2026-01-01T00:00:00Z
  duration_days: 10
  speed: batch

# Sets the sizes of the generated customer, account, and service pools.
population:
  # Available cards and merchants bound scenario participants.
  customers: 500
  institutions: 5
  accounts: 700
  cards: 600
  merchants: 25
  devices: 300
  pix_keys: 0

# Controls account currency, opening balances, credit, and overdraft ranges.
account_finances:
  currency: USD
  opening_balance_min: 200000.0
  opening_balance_max: 500000.0
  credit_limit_min: 0.0
  credit_limit_max: 150000.0
  overdraft_limit_min: 0.0
  overdraft_limit_max: 20000.0

# Sets the per-card transaction and daily spending limits.
card_limits:
  transaction_limit_min: 2000.0
  transaction_limit_max: 20000.0
  daily_limit_min: 40000.0
  daily_limit_max: 250000.0

# Controls daily payment volume and the share assigned to each rail.
payments:
  # CARD-only traffic isolates the F02 behavior.
  daily_target: 320
  rails:
    CARD: 1.0
    PIX: 0.0
    ACCOUNT_TRANSFER: 0.0

# Shapes legitimate activity, including payment size and active periods.
behavior:
  amount_min: 10.0
  amount_max: 2500.0
  amount_distribution: uniform

# Selects fraud scenarios and controls their prevalence and campaign sizes.
fraud:
  # F02 attempts are bounded by count and attempt_count.
  enabled: true
  target_rate: 0.35
  scenario_count: 140
  hard_negative_rate: 0.0
  scenario_selection: explicit
  scenarios:
    F02:
      enabled: true
      weight: 1.0
      count: 140
      amount_min: 150.0
      amount_max: 2500.0

# Chooses which generated artifacts and external sinks are written.
outputs:
  parquet: true
  postgres: false
  kafka: false
  iceberg: false
