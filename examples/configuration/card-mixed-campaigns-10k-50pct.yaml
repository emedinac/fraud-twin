# Fixes the seed and time window used by this generated run.
simulation:
  # Seed and window make the campaign mix repeatable.
  seed: 42
  start: 2026-01-01T00:00:00Z
  duration_days: 10
  speed: batch

# Sets the sizes of the generated customer, account, and service pools.
population:
  # Cardholder and merchant pools support the card scenarios.
  customers: 100
  institutions: 5
  accounts: 500
  cards: 50
  merchants: 5
  devices: 1000

# Controls account currency, opening balances, credit, and overdraft ranges.
account_finances:
  currency: USD
  opening_balance_min: 5000000.0
  opening_balance_max: 5000000.0

# Sets the per-card transaction and daily spending limits.
card_limits:
  transaction_limit_min: 10000.0
  transaction_limit_max: 10000.0
  daily_limit_min: 2000000.0
  daily_limit_max: 2000000.0

# Controls daily payment volume and the share assigned to each rail.
payments:
  # Keep baseline traffic on CARD to isolate the campaign mix.
  daily_target: 500
  rails:
    CARD: 1.0
    PIX: 0.0
    ACCOUNT_TRANSFER: 0.0

# Shapes legitimate activity, including payment size and active periods.
behavior:
  amount_min: 1.0
  amount_max: 10000.0
  amount_distribution: uniform

# Selects fraud scenarios and controls their prevalence and campaign sizes.
fraud:
  # Scenario counts allocate the total campaign budget by fraud type.
  enabled: true
  target_rate: 0.5
  scenario_count: 267
  hard_negative_rate: 0.0
  scenario_selection: explicit
  scenarios:
    F01:
      enabled: true
      weight: 1.0
      count: 20
      amount_min: 1.0
      amount_max: 10000.0
    F02:
      enabled: true
      weight: 1.0
      count: 120
      amount_min: 1.0
      amount_max: 10000.0
      attempt_count: 20
    F05:
      enabled: true
      weight: 1.0
      count: 127
      amount_min: 1.0
      amount_max: 10000.0
      attempt_count: 20

# Chooses which generated artifacts and external sinks are written.
outputs:
  parquet: true
