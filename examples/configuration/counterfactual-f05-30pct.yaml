# Fixes the seed and time window used by this generated run.
simulation:
  # Fixed seed and window make source selection repeatable.
  seed: 3101
  start: 2026-01-01T00:00:00Z
  duration_days: 10
  speed: batch

# Sets the sizes of the generated customer, account, and service pools.
population:
  # Actor pools provide legitimate sources for alternatives.
  customers: 400
  institutions: 7
  accounts: 1200
  cards: 260
  merchants: 50
  devices: 320
  pix_keys: 0

# Controls account currency, opening balances, credit, and overdraft ranges.
account_finances:
  currency: USD
  opening_balance_min: 400000.0
  opening_balance_max: 800000.0
  credit_limit_min: 0.0
  credit_limit_max: 150000.0
  overdraft_limit_min: 0.0
  overdraft_limit_max: 25000.0

# Sets the per-card transaction and daily spending limits.
card_limits:
  transaction_limit_min: 3000.0
  transaction_limit_max: 20000.0
  daily_limit_min: 80000.0
  daily_limit_max: 300000.0

# Controls daily payment volume and the share assigned to each rail.
payments:
  # Baseline rail mix supplies ordinary source transactions.
  daily_target: 620
  rails:
    CARD: 0.8
    PIX: 0.0
    ACCOUNT_TRANSFER: 0.2

# Shapes legitimate activity, including payment size and active periods.
behavior:
  amount_min: 20.0
  amount_max: 4000.0
  amount_distribution: uniform
  state_change_probability: 0.02

# Selects fraud scenarios and controls their prevalence and campaign sizes.
fraud:
  # F05 count controls campaign capacity, not exact fraud prevalence.
  enabled: true
  target_rate: 0.3
  scenario_count: 120
  hard_negative_rate: 0.0
  scenario_selection: explicit
  scenarios:
    F05:
      enabled: true
      weight: 1.0
      count: 120
      amount_min: 300.0
      amount_max: 4500.0
      attempt_count: 18

# Controls how fraud events become alerts, cases, disputes, and labels.
fraud_workflow:
  enabled: true
  alert_probability: 1.0
  case_open_probability: 1.0
  confirmation_probability: 0.9
  customer_dispute_probability: 0.55
  alert_delay_seconds: 90
  case_open_delay_seconds: 300
  confirmation_delay_seconds: 21600
  customer_dispute_delay_seconds: 43200
  label_delay_seconds: 2400

# Counterfactuals vary selected fraud trajectories within this budget.
counterfactual:
  enabled: true
  budget: 3.0
  source_strategy: chronological_first
  requests:
    - { objective: F05, count: 3 }

# Chooses which generated artifacts and external sinks are written.
outputs:
  parquet: true
