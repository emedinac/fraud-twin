# Fixes the seed and time window used by this generated run.
simulation:
  # Fixed seed keeps generated entities and events reproducible.
  seed: 2705
  start: 2026-01-01T00:00:00Z
  duration_days: 10
  speed: batch

# Sets the sizes of the generated customer, account, and service pools.
population:
  # No cards or merchants are needed for this transfer-only setup.
  customers: 100
  institutions: 5
  accounts: 500
  cards: 0
  merchants: 0
  devices: 100
  pix_keys: 0

# Controls account currency, opening balances, credit, and overdraft ranges.
account_finances:
  currency: USD
  opening_balance_min: 50000000.0
  opening_balance_max: 50000000.0

# Controls daily payment volume and the share assigned to each rail.
payments:
  # Route the baseline stream entirely through account transfers.
  daily_target: 750
  rails:
    CARD: 0.0
    PIX: 0.0
    ACCOUNT_TRANSFER: 1.0

# Shapes legitimate activity, including payment size and active periods.
behavior:
  amount_min: 1.0
  amount_max: 10000.0
  amount_distribution: uniform

# Selects fraud scenarios and controls their prevalence and campaign sizes.
fraud:
  # F03 count sets campaign capacity; target_rate is not a guaranteed share.
  enabled: true
  target_rate: 0.5
  scenario_count: 1250
  hard_negative_rate: 0.0
  scenario_selection: explicit
  scenarios:
    F03:
      enabled: true
      weight: 1.0
      count: 1250
      amount_min: 1000.0
      amount_max: 10000.0

# Controls how fraud events become alerts, cases, disputes, and labels.
fraud_workflow:
  enabled: true
  alert_probability: 1.0
  case_open_probability: 1.0
  confirmation_probability: 0.9
  customer_dispute_probability: 0.5

# Chooses which generated artifacts and external sinks are written.
outputs:
  parquet: true
