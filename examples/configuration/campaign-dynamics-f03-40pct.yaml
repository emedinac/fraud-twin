# Fixes the seed and time window used by this generated run.
simulation:
  # Fixed seed and window make the evolving campaign reproducible.
  seed: 3201
  start: 2026-01-01T00:00:00Z
  duration_days: 14
  speed: batch

# Sets the sizes of the generated customer, account, and service pools.
population:
  # Actor pools support multi-institution campaign movement.
  customers: 500
  institutions: 8
  accounts: 1500
  cards: 300
  merchants: 45
  devices: 350
  pix_keys: 0

# Controls account currency, opening balances, credit, and overdraft ranges.
account_finances:
  currency: USD
  opening_balance_min: 300000.0
  opening_balance_max: 700000.0
  credit_limit_min: 0.0
  credit_limit_max: 200000.0
  overdraft_limit_min: 0.0
  overdraft_limit_max: 50000.0

# Sets the per-card transaction and daily spending limits.
card_limits:
  transaction_limit_min: 4000.0
  transaction_limit_max: 22000.0
  daily_limit_min: 90000.0
  daily_limit_max: 350000.0

# Controls daily payment volume and the share assigned to each rail.
payments:
  # Baseline payments provide activity around the fraud campaign.
  daily_target: 700
  rails:
    CARD: 0.75
    PIX: 0.0
    ACCOUNT_TRANSFER: 0.25

# Shapes legitimate activity, including payment size and active periods.
behavior:
  amount_min: 20.0
  amount_max: 5000.0
  amount_distribution: uniform
  state_change_probability: 0.015

# Selects fraud scenarios and controls their prevalence and campaign sizes.
fraud:
  # F03 attempt count sets campaign capacity, not realized prevalence.
  enabled: true
  target_rate: 0.4
  scenario_count: 180
  hard_negative_rate: 0.0
  scenario_selection: explicit
  scenarios:
    F03:
      enabled: true
      weight: 1.0
      count: 180
      amount_min: 350.0
      amount_max: 5000.0
      attempt_count: 10

# Controls how fraud events become alerts, cases, disputes, and labels.
fraud_workflow:
  enabled: true
  alert_probability: 1.0
  case_open_probability: 1.0
  confirmation_probability: 0.92
  customer_dispute_probability: 0.6
  alert_delay_seconds: 60
  case_open_delay_seconds: 240
  confirmation_delay_seconds: 21600
  customer_dispute_delay_seconds: 43200
  label_delay_seconds: 1800

# Graph topology supplies the campaign structure for dynamic actions.
graph:
  # Cross-institution mule structure anchors the dynamic campaign.
  enabled: true
  scenarios:
    - type: MULE_NETWORK
      count: 6
      source_count: 3
      min_amount: 500.0
      max_amount: 4800.0
      window_seconds: 5400
      institution_scope: CROSS_INSTITUTION
      modifiers: [CROSS_INSTITUTION]

# Add a bounded number of actions to each bound campaign.
campaign_dynamics:
  # Bound actions limit how far the campaign can evolve.
  enabled: true
  bindings:
    - profile: linear
      allowed_rails: [CARD, ACCOUNT_TRANSFER]
      max_actions: 3
      max_actor_joins: 0
      max_actor_leaves: 0
      max_mule_rotations: 0
      max_device_rotations: 0
      max_splits: 0
      max_merges: 0

# Chooses which generated artifacts and external sinks are written.
outputs:
  parquet: true
