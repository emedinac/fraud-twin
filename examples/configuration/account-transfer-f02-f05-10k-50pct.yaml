# Fixes the seed and time window used by this generated run.
simulation:
  # Seed and date window make this run repeatable.
  seed: 42
  start: 2026-01-01T00:00:00Z
  duration_days: 10
  speed: batch

# Sets the sizes of the generated customer, account, and service pools.
population:
  # Pool sizes set how many entities can take part.
  customers: 100
  institutions: 5
  accounts: 500
  cards: 50
  merchants: 5
  devices: 1000
  pix_keys: 500

# Controls account currency, opening balances, credit, and overdraft ranges.
account_finances:
  currency: USD
  opening_balance_min: 5000000.0
  opening_balance_max: 5000000.0

# Controls daily payment volume and the share assigned to each rail.
payments:
  # Baseline volume and rail weights define ordinary traffic.
  daily_target: 500
  rails:
    CARD: 0.0
    PIX: 0.0
    ACCOUNT_TRANSFER: 1.0

# Shapes legitimate activity, including payment size and active periods.
behavior:
  amount_min: 0.01
  amount_max: 1000.0
  amount_distribution: uniform

# Selects fraud scenarios and controls their prevalence and campaign sizes.
fraud:
  # Scenario counts bound fraud; target_rate is not a guaranteed data share.
  enabled: true
  target_rate: 0.5
  scenario_count: 1100
  hard_negative_rate: 0.0
  scenario_selection: explicit
  scenarios:
    F02:
      enabled: true
      weight: 1.0
      count: 100
      amount_min: 0.01
      amount_max: 1000.0
      attempt_count: 20
    F03:
      enabled: true
      weight: 1.0
      count: 100
      amount_min: 0.01
      amount_max: 1000.0
    F04:
      enabled: true
      weight: 1.0
      count: 800
      amount_min: 0.01
      amount_max: 1000.0
    F05:
      enabled: true
      weight: 1.0
      count: 100
      amount_min: 0.01
      amount_max: 1000.0
      attempt_count: 20

# Chooses which generated artifacts and external sinks are written.
outputs:
  parquet: true
