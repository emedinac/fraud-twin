# Fixes the seed and time window used by this generated run.
simulation:
  seed: 4109
  start: 2026-01-01T00:00:00Z
  duration_days: 10
  speed: batch

# Sets the sizes of the generated customer, account, and service pools.
population:
  customers: 600
  institutions: 8
  accounts: 1400
  cards: 300
  merchants: 50
  devices: 420
  pix_keys: 0

# Controls daily payment volume and the share assigned to each rail.
payments:
  daily_target: 1000
  rails: {CARD: 0.70, ACCOUNT_TRANSFER: 0.30}

# Shapes legitimate activity, including payment size and active periods.
behavior:
  amount_min: 25.0
  amount_max: 5500.0

# Selects fraud scenarios and controls their prevalence and campaign sizes.
fraud:
  enabled: true
  target_rate: 0.25
  scenario_count: 180
  scenario_selection: explicit
  scenarios:
    F05: {enabled: true, weight: 1.0, count: 180, attempt_count: 10}

# Controls how fraud events become alerts, cases, disputes, and labels.
fraud_workflow:
  enabled: true
  alert_probability: 1.0
  case_open_probability: 1.0

# Controls the data-quality profile and any injected faults or outages.
quality:
  profile: hostile
  duplicate_event_probability: 0.01
  missing_optional_probability: 0.03
  late_event_probability: 0.04
  outages:
    - source: payment_events
      from: 2026-01-04T08:00:00Z
      to: 2026-01-04T10:00:00Z
      behavior: BUFFER_AND_FLUSH
  schema_changes:
    - at: 2026-01-06T00:00:00Z
      event: payment_events
      version: "2"
      change: {add_optional_field: risk_reason}
      compatibility: BACKWARD_COMPATIBLE

# Chooses which generated artifacts and external sinks are written.
outputs:
  parquet: true
