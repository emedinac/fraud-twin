# Fixes the seed and time window used by this generated run.
simulation:
  # Fixed seed and year-long window support repeatable comparison.
  seed: 42
  start: 2020-01-01T00:00:00Z
  duration_days: 365
  speed: batch

# Sets the sizes of the generated customer, account, and service pools.
population:
  # Entity counts define the actors available to the transfer stream.
  customers: 100
  institutions: 5
  accounts: 500
  cards: 50
  merchants: 5
  devices: 1000

# Controls account currency, opening balances, credit, and overdraft ranges.
account_finances:
  currency: USD
  opening_balance_min: 50000000.0
  opening_balance_max: 50000000.0

# Controls daily payment volume and the share assigned to each rail.
payments:
  # All baseline payments use the account-transfer rail.
  daily_target: 14
  rails:
    CARD: 0.0
    PIX: 0.0
    ACCOUNT_TRANSFER: 1.0

# Shapes legitimate activity, including payment size and active periods.
behavior:
  amount_min: 1000.0
  amount_max: 10000.0
  amount_distribution: uniform

# Selects fraud scenarios and controls their prevalence and campaign sizes.
fraud:
  # F03 count controls campaign capacity; target_rate is not a guarantee.
  enabled: true
  target_rate: 0.5
  scenario_count: 2445
  hard_negative_rate: 0.0
  scenario_selection: explicit
  scenarios:
    F03:
      enabled: true
      weight: 1.0
      count: 2445
      amount_min: 1000.0
      amount_max: 10000.0

# Chooses which generated artifacts and external sinks are written.
outputs:
  parquet: true
