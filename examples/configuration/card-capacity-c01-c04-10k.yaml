# Fixes the seed and time window used by this generated run.
simulation:
  # Fixed seed keeps the capacity example reproducible.
  seed: 42
  start: 2026-01-01T00:00:00Z
  duration_days: 10
  speed: batch

# C06-C11: entity pools; cards and merchants are required by F02.
population:
  # These entity counts define the available card and merchant pools.
  customers: 100
  institutions: 5
  accounts: 500
  cards: 50
  merchants: 5
  devices: 1000

# C04: account ledger funding must cover the generated debits.
account_finances:
  currency: USD
  opening_balance_min: 5000000.0
  opening_balance_max: 5000000.0

# Per-card transaction and daily caps are separate from the C04 ledger limit.
card_limits:
  transaction_limit_min: 10000.0
  transaction_limit_max: 10000.0
  daily_limit_min: 2000000.0
  daily_limit_max: 2000000.0

# C01 baseline-payment capacity: 500/day * 10 days = 5,000 payments.
payments:
  # Baseline volume is 500 payments per day for ten days.
  daily_target: 500
  rails:
    CARD: 1.0
    PIX: 0.0
    ACCOUNT_TRANSFER: 0.0

# Shapes legitimate activity, including payment size and active periods.
behavior:
  amount_min: 1.0
  amount_max: 10000.0
  amount_distribution: uniform

# Selects fraud scenarios and controls their prevalence and campaign sizes.
fraud:
  # Campaign count is capped to match the intended capacity test.
  enabled: true
  target_rate: 0.5
  # C02 overall campaign budget; C03 F02 scenario capacity is also 250.
  scenario_count: 250
  hard_negative_rate: 0.0
  scenario_selection: explicit
  scenarios:
    F02:
      enabled: true
      weight: 1.0
      count: 250
      amount_min: 1.0
      amount_max: 10000.0
      attempt_count: 20

# Chooses which generated artifacts and external sinks are written.
outputs:
  parquet: true
