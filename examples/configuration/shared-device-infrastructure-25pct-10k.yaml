# Fixes the seed and time window used by this generated run.
simulation:
  seed: 4104
  start: 2026-01-01T00:00:00Z
  duration_days: 10
  speed: batch

# Sets the sizes of the generated customer, account, and service pools.
population:
  customers: 600
  institutions: 8
  accounts: 1400
  cards: 300
  merchants: 50
  devices: 420
  pix_keys: 0

# Controls daily payment volume and the share assigned to each rail.
payments:
  daily_target: 1000
  rails: {CARD: 0.75, ACCOUNT_TRANSFER: 0.25}

# Shapes legitimate activity, including payment size and active periods.
behavior:
  amount_min: 25.0
  amount_max: 5500.0

# Selects fraud scenarios and controls their prevalence and campaign sizes.
fraud:
  enabled: true
  target_rate: 0.25
  scenario_count: 180
  scenario_selection: explicit
  scenarios:
    F05: {enabled: true, weight: 1.0, count: 180, attempt_count: 10}

# Controls how fraud events become alerts, cases, disputes, and labels.
fraud_workflow:
  enabled: true
  alert_probability: 1.0
  case_open_probability: 1.0

# Defines shared entities and network structures used by graph scenarios.
graph:
  enabled: true
  export_policy: observable
  scenarios:
    - type: SHARED_DEVICE_INFRASTRUCTURE
      count: 24
      member_count: 8
      window_seconds: 7200
      modifiers: [CAMOUFLAGE_RELATION]

# Chooses which generated artifacts and external sinks are written.
outputs:
  parquet: true
